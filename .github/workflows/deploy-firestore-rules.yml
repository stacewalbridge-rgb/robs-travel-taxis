name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBS_TRAVEL }}
          project_id: robs-travel-taxis
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate deployment inputs
        run: |
          test -s firebase/firestore.rules
          test -s firebase.json
          firebase --version

      - name: Deploy Firestore rules
        env:
          GOOGLE_CLOUD_PROJECT: robs-travel-taxis
          GCLOUD_PROJECT: robs-travel-taxis
        run: firebase deploy --only firestore:rules --project robs-travel-taxis --non-interactive
