name: Validate south corridor pricing workflow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-south-pricing.yml'
      - 'robs-travel-complete-website/assets/site.js'
      - 'robs-travel-complete-website/index.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check website JavaScript syntax
        run: node --check robs-travel-complete-website/assets/site.js

      - name: Check required pricing files exist
        run: |
          test -s robs-travel-complete-website/assets/site.js
          test -s robs-travel-complete-website/index.html

      - name: Confirm route and run-out code is present
        run: |
          grep -q "runoutBands" robs-travel-complete-website/assets/site.js
          grep -q "runoutCharge" robs-travel-complete-website/assets/site.js
          grep -q "routeBetween" robs-travel-complete-website/assets/site.js
