name: Deploy Firestore Rules

# Triggered 2026-08-18 after staff booking/save rule repair.
on:
  workflow_dispatch:
  push:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: robs-travel-taxis
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBS_TRAVEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Google credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '')
          if not raw.strip():
              raise SystemExit('Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_ROBS_TRAVEL')
          data = json.loads(raw)
          if data.get('project_id') != 'robs-travel-taxis':
              raise SystemExit('Firebase credential is for the wrong project')
          for key in ('client_email', 'private_key'):
              if not data.get(key):
                  raise SystemExit(f'Firebase credential is missing {key}')
          path = pathlib.Path('/tmp/firebase-service-account.json')
          path.write_text(json.dumps(data), encoding='utf-8')
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'GOOGLE_APPLICATION_CREDENTIALS={path}\n')
              env.write('GOOGLE_CLOUD_PROJECT=robs-travel-taxis\n')
              env.write('GCLOUD_PROJECT=robs-travel-taxis\n')
          print('Firebase credentials prepared successfully')
          PY

      - name: Validate Firestore files
        shell: bash
        run: |
          test -s firebase/firestore.rules
          test -s firebase.json
          python -m json.tool firebase.json >/dev/null

      - name: Deploy Firestore rules
        shell: bash
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
