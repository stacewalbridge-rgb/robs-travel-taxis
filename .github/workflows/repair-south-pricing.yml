name: Repair south corridor website pricing

on:
  push:
    paths:
      - '.github/workflows/repair-south-pricing.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Robs Travel estimator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('robs-travel-complete-website/assets/site.js')
          s=p.read_text(encoding='utf-8-sig')

          s=s.replace('fixed-fares.js?v=master-20260812-runout2','fixed-fares.js?v=south-runout-20260818')

          # Exact North Cornwall meter calculation for ordinary day/night journeys. Run-out is added separately.
          s=re.sub(
            r"function fareFromMiles\(miles,date,time\)\{.*?\}\nasync function routeBetween",
            """function fareFromMiles(miles,date,time){const type=document.getElementById('vehicle')?.value,large=type==='mpv'||type==='minibus';const d=new Date(`${date}T${time||'12:00'}`),mins=d.getHours()*60+d.getMinutes(),night=d.getDay()===0||mins<420||mins>=1140;const first=large?(night?7.4:6.3):(night?5:4.2),step=large?(night?.5:.45):(night?.4:.3);const extraSteps=Math.max(0,Math.ceil((Number(miles)-.2-1e-9)/.1));return first+(extraSteps*step)+1}
async function routeBetween""",
            s,flags=re.S)

          # For the south-of-Bude corridor the run-out must be measured to the southern endpoint, not to Bude.
          s=re.sub(
            r"async function runoutCharge\(\)\{.*?\}\nconst estimateForm",
            """const southRunoutTerms=['widemouth','widemouth bay','crackington','crackington haven','boscastle','tintagel','camelford'];
function isSouthRunoutPlace(place){const v=norm(place?.address||'');return southRunoutTerms.some(x=>v.includes(norm(x)))}
async function runoutCharge(){const base={lat:50.8308,lng:-4.5460,address:'Bude town centre'},p=norm(pickupPlace.address),d=norm(destinationPlace.address),candidates=[];if(isSouthRunoutPlace(pickupPlace))candidates.push(pickupPlace);if(isSouthRunoutPlace(destinationPlace))candidates.push(destinationPlace);if(!candidates.length){if(budeTerms.some(x=>p.includes(norm(x))))candidates.push(pickupPlace);if(budeTerms.some(x=>d.includes(norm(x))))candidates.push(destinationPlace);}if(!candidates.length)candidates.push(pickupPlace,destinationPlace);let best=Infinity;for(const c of candidates){try{const r=await routeBetween(base,{lat:c.location.lat(),lng:c.location.lng(),placeId:c.placeId,address:c.address});best=Math.min(best,r.distanceMeters/1609.344)}catch{const cp=point(c);if(cp)best=Math.min(best,haversine(base,cp))}}if(!Number.isFinite(best))return{charge:0,miles:0};const band=runoutBands.find(x=>best<=x[0]);return band?{charge:band[1],miles:best}:{charge:null,miles:best}}
const estimateForm""",
            s,flags=re.S)

          old="fixed=masterFixedFare(pickupPlace.address,destinationPlace.address,date,time),runout=fixed?await runoutCharge():{charge:0,miles:0};if(runout.charge===null)"
          new="fixed=masterFixedFare(pickupPlace.address,destinationPlace.address,date,time),runout=await runoutCharge();if(runout.charge===null)"
          if old not in s:
              raise SystemExit('estimate runout anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          i=Path('robs-travel-complete-website/index.html')
          html=i.read_text(encoding='utf-8-sig')
          html=re.sub(r'/assets/site\.js\?v=[^\"\']+','/assets/site.js?v=20260818-south-runout',html)
          i.write_text(html,encoding='utf-8')
          PY
      - name: Verify pricing patch
        run: |
          grep -q "southRunoutTerms" robs-travel-complete-website/assets/site.js
          grep -q "runout=await runoutCharge" robs-travel-complete-website/assets/site.js
          grep -q "south-runout-20260818" robs-travel-complete-website/assets/site.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robs-travel-complete-website/assets/site.js robs-travel-complete-website/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Tintagel Boscastle south corridor pricing"
          git push
